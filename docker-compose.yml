# Full self-hosted stack: Postgres + Node backend + Caddy (HTTPS + frontend).
# Copy deploy/env.production.example to .env on the server and fill it in,
# then: docker compose up -d --build
#
# This is the self-hosted path. The live deployment (Neon + Railway) doesn't
# use this file at all — Railway builds straight from the Dockerfile and Neon
# is a separate managed Postgres, no "postgres" service needed there.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: modbus
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modbus"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network the DB is the "postgres" service.
      DATABASE_URL: postgres://modbus:${POSTGRES_PASSWORD}@postgres:5432/modbus
      PORT: "5400"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
